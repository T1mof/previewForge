apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: previewforge-leader-election
  namespace: previewforge-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: previewforge-leader-election
  namespace: previewforge-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: previewforge-leader-election
subjects:
  - kind: ServiceAccount
    name: previewforge-controller-manager
    namespace: previewforge-system
