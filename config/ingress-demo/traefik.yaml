# Test/demo infrastructure. Apply only inside a newly claimed disposable kind cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: previewforge-ingress-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: previewforge-ingress-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: previewforge-demo-traefik
rules:
  - apiGroups: [""]
    resources: [services, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: previewforge-demo-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: previewforge-demo-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: previewforge-ingress-system
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: previewforge-demo
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: previewforge-ingress-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: previewforge-demo-traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: previewforge-demo-traefik
    spec:
      serviceAccountName: traefik
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=previewforge-demo
            - --entrypoints.web.address=:8080
            - --entrypoints.websecure.address=:8443
            - --entrypoints.ping.address=:9000
            - --ping=true
            - --ping.entrypoint=ping
          ports:
            - name: web
              containerPort: 8080
            - name: websecure
              containerPort: 8443
            - name: ping
              containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: ping
          livenessProbe:
            httpGet:
              path: /ping
              port: ping
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: previewforge-ingress-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: previewforge-demo-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      nodePort: 30080
    - name: websecure
      port: 443
      targetPort: websecure
      nodePort: 30443
