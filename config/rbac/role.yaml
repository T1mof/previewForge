---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: previewforge-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - platform.previewforge.dev
  resources:
  - previewenvironments
  verbs:
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.previewforge.dev
  resources:
  - previewenvironments/finalizers
  verbs:
  - update
- apiGroups:
  - platform.previewforge.dev
  resources:
  - previewenvironments/status
  verbs:
  - get
  - patch
  - update
