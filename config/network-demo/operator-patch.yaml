apiVersion: apps/v1
kind: Deployment
metadata:
  name: previewforge-controller-manager
  namespace: previewforge-system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --ingress-controller-namespace=previewforge-ingress-system
            - --ingress-controller-pod-selector=platform.previewforge.dev/ingress-gateway=true
