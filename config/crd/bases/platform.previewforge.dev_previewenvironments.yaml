---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: previewenvironments.platform.previewforge.dev
spec:
  group: platform.previewforge.dev
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    shortNames:
    - preview
    singular: previewenvironment
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Expires is an absolute deadline; date columns display an age
          and reject future times.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              image:
                description: Image is a container image reference accessible from
                  the cluster.
                maxLength: 512
                minLength: 1
                pattern: ^\S+$
                type: string
              ingress:
                description: Ingress exposes the application through an installed
                  Ingress controller.
                properties:
                  className:
                    description: ClassName explicitly selects an IngressClass installed
                      by the cluster administrator.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                  host:
                    description: Host is an exact DNS hostname; wildcard hosts and
                      IP addresses are not supported.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                    x-kubernetes-validations:
                    - message: host must be a DNS name rather than an IP address
                      rule: '!isIP(self)'
                  tlsSecretName:
                    description: |-
                      TLSSecretName references a TLS Secret provisioned separately in the preview Namespace.
                      The operator does not read, copy or create Secrets.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                    type: string
                required:
                - className
                - host
                type: object
              port:
                default: 80
                description: Port is used by the container, Service and TCP readiness
                  probe.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                default: 1
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              resources:
                description: Resources overrides the application container defaults
                  within preview budgets.
                properties:
                  limits:
                    default: {}
                    properties:
                      cpu:
                        default: 500m
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: CPU limit must be between 1m and 1
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('1m'))
                            >= 0 && quantity(self).compareTo(quantity('1')) <= 0
                      memory:
                        default: 256Mi
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: memory limit must be between 16Mi and 1Gi
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('16Mi'))
                            >= 0 && quantity(self).compareTo(quantity('1Gi')) <= 0
                    type: object
                  requests:
                    default: {}
                    properties:
                      cpu:
                        default: 100m
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: CPU request must be between 1m and 500m
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('1m'))
                            >= 0 && quantity(self).compareTo(quantity('500m')) <=
                            0
                      memory:
                        default: 64Mi
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: memory request must be between 16Mi and 512Mi
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('16Mi'))
                            >= 0 && quantity(self).compareTo(quantity('512Mi')) <=
                            0
                    type: object
                type: object
                x-kubernetes-validations:
                - message: CPU request must not exceed its limit
                  rule: '!has(self.requests) || !has(self.limits) || !has(self.requests.cpu)
                    || !has(self.limits.cpu) || !isQuantity(self.requests.cpu) ||
                    !isQuantity(self.limits.cpu) || quantity(self.requests.cpu).compareTo(quantity(self.limits.cpu))
                    <= 0'
                - message: memory request must not exceed its limit
                  rule: '!has(self.requests) || !has(self.limits) || !has(self.requests.memory)
                    || !has(self.limits.memory) || !isQuantity(self.requests.memory)
                    || !isQuantity(self.limits.memory) || quantity(self.requests.memory).compareTo(quantity(self.limits.memory))
                    <= 0'
              securityProfile:
                default: baseline
                description: |-
                  SecurityProfile selects Namespace admission and managed Pod hardening.
                  Restricted cannot be downgraded through this API.
                enum:
                - baseline
                - restricted
                type: string
                x-kubernetes-validations:
                - message: restricted security profile cannot be downgraded
                  rule: oldSelf != 'restricted' || self == 'restricted'
              ttlSeconds:
                default: 3600
                description: TTLSeconds is measured from metadata.creationTimestamp,
                  including downtime.
                format: int64
                maximum: 604800
                minimum: 1
                type: integer
            required:
            - image
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                format: date-time
                type: string
              message:
                type: string
              namespace:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Deploying
                - Ready
                - Failed
                - Expired
                type: string
              readyReplicas:
                format: int32
                type: integer
              serviceEndpoint:
                type: string
              url:
                description: URL is the configured Ingress route, not proof of DNS,
                  TLS or external reachability.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
