apiVersion: v1
kind: ServiceAccount
metadata:
  name: previewforge-admission
  namespace: previewforge-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: previewforge-admission
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: previewforge-admission-reader
subjects:
  - kind: ServiceAccount
    name: previewforge-admission
    namespace: previewforge-system
---
apiVersion: v1
kind: Service
metadata:
  name: previewforge-admission
  namespace: previewforge-system
spec:
  selector:
    app.kubernetes.io/name: previewforge-admission
  ports:
    - name: https
      port: 443
      targetPort: 9443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: previewforge-admission
  namespace: previewforge-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: previewforge-admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: previewforge-admission
    spec:
      serviceAccountName: previewforge-admission
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admission
          image: previewforge:dev
          command: [/admission]
          args: [--cert-dir=/certs]
          ports:
            - name: https
              containerPort: 9443
          readinessProbe:
            tcpSocket:
              port: https
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: previewforge-admission-tls
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: previewforge-ownership
webhooks:
  - name: ownership.platform.previewforge.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 5
    matchConditions:
      - name: operator-identity
        expression: "request.userInfo.username == 'system:serviceaccount:previewforge-system:previewforge-controller-manager'"
    clientConfig:
      service:
        name: previewforge-admission
        namespace: previewforge-system
        path: /validate-ownership
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [namespaces, services, resourcequotas, limitranges]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments]
      - apiGroups: [networking.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [ingresses, networkpolicies]
