global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: previewforge
    scheme: https
    scrape_timeout: 4s
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      # Fresh local kind only: the operator generates an ephemeral certificate.
      # For a deployed cluster mount a serving certificate and verify its CA/SAN.
      insecure_skip_verify: true
    static_configs:
      - targets: [previewforge-metrics.previewforge-system.svc.cluster.local:8443]
