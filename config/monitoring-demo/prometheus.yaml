apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: previewforge-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: previewforge-prometheus-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: previewforge-metrics-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: previewforge-monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: previewforge-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: previewforge-prometheus}
  template:
    metadata:
      labels: {app: previewforge-prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
            - --storage.tsdb.retention.size=128MB
          ports: [{name: http, containerPort: 9090}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: previewforge-prometheus-config}
        - name: data
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: previewforge-monitoring
spec:
  selector: {app: previewforge-prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
