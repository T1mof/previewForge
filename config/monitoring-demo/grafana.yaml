apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: previewforge-monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: previewforge-grafana}
  template:
    metadata:
      labels: {app: previewforge-grafana}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: previewforge-grafana-admin, key: password}
          ports: [{name: http, containerPort: 3000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/providers.yaml, subPath: providers.yaml, readOnly: true}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: previewforge-grafana-config}
        - name: dashboard
          configMap: {name: previewforge-grafana-dashboard}
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: previewforge-monitoring
spec:
  selector: {app: previewforge-grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
